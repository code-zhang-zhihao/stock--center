[project]
name = "stock-center-back"
version = "0.1.0"
description = "New Python backend for stock-center market data migration."
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.0",
    "apscheduler>=3.10.4,<4.0.0",
    "asyncpg>=0.29.0",
    "chinesecalendar>=1.10.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "httpx>=0.25.0,<0.26.0",
    "mootdx>=0.11.7",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
